# Render Blueprint — one-click backend deploy.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: sino-operating-layer-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    disk:
      name: sino-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: XAI_API_KEY
        sync: false  # set in Render dashboard
      - key: LLM_PROVIDER
        value: grok
      - key: LLM_MODEL
        value: grok-4-fast-non-reasoning
      - key: CORS_ORIGINS
        sync: false  # set to your Vercel URL, e.g. https://sino-app.vercel.app
